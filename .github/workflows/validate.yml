name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are valid JSON and versions match
        run: |
          jq . .claude-plugin/plugin.json > /dev/null
          jq . .claude-plugin/marketplace.json > /dev/null
          a=$(jq -r .version .claude-plugin/plugin.json)
          b=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          [ "$a" = "$b" ] || { echo "version mismatch: plugin.json=$a marketplace.json=$b"; exit 1; }
          grep -q "## $a " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $a"; exit 1; }
      - name: Every agent and skill has name and description
        run: |
          for f in agents/*.md skills/*/SKILL.md; do
            head -20 "$f" | grep -q '^name: ' || { echo "$f: missing name"; exit 1; }
            head -20 "$f" | grep -q '^description: ' || { echo "$f: missing description"; exit 1; }
          done
      - name: No hooks, scripts or MCP servers in the plugin
        run: |
          test ! -e hooks
          jq -e '(has("hooks") or has("mcpServers")) | not' .claude-plugin/plugin.json
          test ! -e .mcp.json
          test -z "$(find agents skills -type f ! -name '*.md')"
